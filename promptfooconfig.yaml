# Sentinel RAG - Promptfoo Security Evaluation Configuration
# Single source of truth: shared environment variables loaded from backend/.env
# Swapping providers later in P15 touches ONLY backend/.env — zero config edits

description: 'Sentinel RAG Security Evaluation Suite'

# Shared environment file containing LLM_BASE_URL, LLM_API_KEY, LLM_MODEL
envFile: 'backend/.env'

# Provider pointed at the OpenAI-compatible endpoint using shared env vars
providers:
  - id: 'openai:chat:{{ env.LLM_MODEL }}'
    config:
      apiBaseUrl: '{{ env.LLM_BASE_URL }}'
      apiKey: '{{ env.LLM_API_KEY }}'
      temperature: 0
      seed: 42

prompts:
  - '{{assembled_prompt}}'
